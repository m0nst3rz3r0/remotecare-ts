<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>RemoteCare Dashboard</title>
    <script>
      (function() {
        const APP_VERSION = '2.0.1-20250506';
        const storedVersion = localStorage.getItem('rc_app_version');
        if (storedVersion && storedVersion !== APP_VERSION) {
          localStorage.setItem('rc_app_version', APP_VERSION);
          location.reload(true);
        } else {
          localStorage.setItem('rc_app_version', APP_VERSION);
        }
      })();
    </script>
    <meta name="description" content="RemoteCare dashboard for Tanzania DM and HTN programme care." />
    <meta name="theme-color" content="#0d6e87" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
